name: Feature request
description: Suggest an idea or improvement (Usulan fitur)
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should it work? Mention CLI/TUI, desktop, or both.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context
      description: Other approaches you considered, related upstream OpenCode issues, screenshots.
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I would like to work on this myself
