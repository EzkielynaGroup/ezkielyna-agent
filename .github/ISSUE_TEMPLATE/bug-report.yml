name: Bug report
description: Something does not work as expected (Laporan bug)
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. English or Bahasa Indonesia are both fine.
        **Never paste an API key** (`sk-...`). For security problems use private vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `ezkielyna` in ...
        2. ...
    validations:
      required: true
  - type: dropdown
    id: product
    attributes:
      label: Product
      options:
        - CLI / TUI
        - Desktop app
        - Installer (install / install.ps1)
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `ezkielyna --version`, or the commit you built from
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and architecture
      placeholder: macOS 26 arm64 / Ubuntu 24.04 x64 / Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or `ezkielyna doctor` output
      description: Keys are redacted automatically in logs, but please check before posting.
      render: shell
